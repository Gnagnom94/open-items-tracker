name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests with coverage
        env:
          NO_COLOR: 1
        run: xvfb-run -a npx @vscode/test-cli --coverage --coverage-reporter json-summary --coverage-reporter text --coverage-output ./coverage 2>&1 | tee coverage-output.txt

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage-output.txt

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Debug: show coverage output directory
          ls -la ./coverage/ || echo "No coverage directory found"
          # Read statement coverage from the JSON summary (deterministic)
          COVERAGE=$(node -p "JSON.parse(require('fs').readFileSync('./coverage/coverage-summary.json','utf8')).total.statements.pct")
          echo "percentage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "✅ Coverage: ${COVERAGE}%"

          # Determine badge color
          if (( $(echo "$COVERAGE >= 100" | bc -l) )); then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$COVERAGE >= 90" | bc -l) )); then
            echo "color=green" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            echo "color=yellowgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: open-items-tracker-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.coverage.outputs.color }}
